<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pintdrBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1817" />
      <stop offset="100%" stop-color="#120e0e" />
    </linearGradient>
    <linearGradient id="beerLiquid" x1="11" y1="14" x2="31" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="beerFoam" x1="10" y1="7" x2="32" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="30" y1="18" x2="40" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="18" y1="33" x2="24" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="48" height="48" rx="13" fill="url(#pintdrBg)" stroke="#382927" stroke-width="1.5" />

  <!-- Sturdy Beer Mug Handle -->
  <path d="M29 18 C36.5 18 39.5 21 39.5 26.5 C39.5 32 36.5 35 29 35" stroke="url(#handleGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M29 18.5 C35 18.5 37.5 21 37.5 26.5 C37.5 32 35 34.5 29 34.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Heavy Glass Bottom Shelf / Base -->
  <rect x="10" y="38.5" width="22" height="3" rx="1.5" fill="#9a3412" opacity="0.8" />

  <!-- Beer Mug Body -->
  <rect x="11" y="14" width="20" height="26" rx="2" fill="url(#beerLiquid)" />

  <!-- Glass Vertical Facet Reflections -->
  <line x1="14.5" y1="16" x2="14.5" y2="37" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round" />
  <line x1="21" y1="16" x2="21" y2="37" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="27.5" y1="16" x2="27.5" y2="37" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round" />

  <!-- Carbonation Bubbles -->
  <circle cx="17.5" cy="33" r="1.2" fill="#ffffff" opacity="0.6" />
  <circle cx="24.5" cy="31" r="0.9" fill="#ffffff" opacity="0.5" />
  <circle cx="16" cy="24" r="0.8" fill="#ffffff" opacity="0.6" />
  <circle cx="25.5" cy="20" r="1.1" fill="#ffffff" opacity="0.7" />

  <!-- Pintdr Flame Badge on Mug Belly -->
  <path d="M21 33 C18.8 33 17 31.2 17 29 C17 26.7 19.1 24.6 20.8 22.6 C21.4 21.9 21.5 20.8 21.5 20.8 C22.2 22 23.4 23.2 24.2 24.5 C25.1 25.9 25.4 27.3 25.4 29 C25.4 31.2 23.3 33 21 33 Z" fill="url(#flameGrad)" />
  <path d="M21 31.8 C19.6 31.8 18.5 30.7 18.5 29.2 C18.5 27.8 19.8 26.6 20.9 25.3 C21.2 25 21.4 24 21.4 24 C21.8 24.8 22.6 25.6 23.1 26.5 C23.7 27.4 23.9 28.3 23.9 29.2 C23.9 30.7 22.5 31.8 21 31.8 Z" fill="#ff385c" />

  <!-- Rich Foam Head -->
  <path d="M12.5 14 C12.5 17.5 14.8 17.5 14.8 14 Z" fill="url(#beerFoam)" />
  <rect x="9.5" y="9.5" width="23" height="6" rx="3" fill="url(#beerFoam)" />
  <ellipse cx="14" cy="11.5" rx="3" ry="1.5" fill="#ffffff" opacity="0.9" />
  <ellipse cx="21" cy="11" rx="4" ry="1.8" fill="#ffffff" opacity="0.9" />
  <ellipse cx="28" cy="11.5" rx="3" ry="1.5" fill="#ffffff" opacity="0.9" />
</svg>
